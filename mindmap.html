<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --bg-dot: rgba(255,255,255,0.06);
    --toolbar: #1b1f27;
    --toolbar-border: #2a2f3a;
    --ink: #e9e6de;
    --muted: #8b93a1;
    --accent: #5eb8a4;
    --accent-dim: #3d7d70;
    --node-bg: #f6f1e6;
    --node-border: #d8cdb4;
    --node-text: #23201a;
    --danger: #d1615b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--ink);
  }

  /* ---------- Toolbar ---------- */
  #toolbar{
    position:fixed; top:0; left:0; right:0; height:60px;
    background:var(--toolbar);
    border-bottom:1px solid var(--toolbar-border);
    display:flex; align-items:center; gap:8px;
    padding:0 14px;
    z-index:100;
    overflow-x:auto;
  }
  #toolbar h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px; font-weight:600; letter-spacing:0.01em;
    margin:0 12px 0 0; color:var(--ink); white-space:nowrap;
  }
  .btn{
    font-family:'Inter', sans-serif;
    font-size:13px; font-weight:500;
    color:var(--ink);
    background:#242a35;
    border:1px solid var(--toolbar-border);
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
    white-space:nowrap;
    flex:none;
  }
  .btn:hover{ background:#2c3340; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#0d1712; font-weight:600; }
  .btn.primary:hover{ background:#6ec3b0; }
  .btn.active{ background:var(--accent-dim); border-color:var(--accent); color:#eafff9; }
  .btn.ghost{ background:transparent; }
  .btn.ghost:hover{ background:#242a35; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; pointer-events:none; }
  #toolbar .spacer{ flex:1; min-width:8px; }
  #hint{
    font-size:12.5px; color:var(--muted); margin-right:8px; white-space:nowrap;
  }
  #fileInput{ display:none; }
  #fileIndicator{
    display:flex; align-items:center; gap:6px; flex:none;
    font-family:'Inter', sans-serif; font-size:13px; color:var(--muted);
    white-space:nowrap;
  }
  #fileIndicator .dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    display:inline-block; flex:none;
  }
  #fileIndicator.saving .dot{ background:#e0b354; }
  #fileIndicator.unsupported .dot{ background:var(--muted); }
  #fileNameLabel{ white-space:nowrap; }
  #fileMenu{
    -webkit-appearance:none; appearance:none;
    padding-right:22px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 12px) center, calc(100% - 8px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  #fileMenu option{ background:#1b1f27; color:var(--ink); }


  /* ---------- Zoom controls ---------- */
  #zoomControls{
    display:flex; align-items:center; gap:2px; flex:none;
    background:#242a35; border:1px solid var(--toolbar-border); border-radius:8px;
    padding:2px;
  }
  #zoomControls button{
    width:28px; height:28px; border:none; background:transparent;
    color:var(--ink); font-size:16px; font-weight:600; cursor:pointer;
    border-radius:6px; line-height:1;
  }
  #zoomControls button:hover{ background:#2c3340; }
  #zoomLabel{
    font-size:12px; color:var(--muted); width:44px; text-align:center;
    cursor:pointer; user-select:none;
  }

  /* ---------- Search ---------- */
  #searchWrap{ position:relative; flex:none; }
  #searchInput{
    font-family:'Inter', sans-serif; font-size:13px;
    width:135px; padding:7px 10px;
    background:#242a35; color:var(--ink);
    border:1px solid var(--toolbar-border); border-radius:8px;
    outline:none;
    transition:width .15s;
  }
  #searchInput::placeholder{ color:var(--muted); }
  #searchInput:focus{ border-color:var(--accent); width:190px; }

  /* ---------- Search results side panel ---------- */
  #searchPanel{
    position:fixed; top:60px; left:0; bottom:0;
    width:280px;
    background:var(--toolbar);
    border-right:1px solid var(--toolbar-border);
    box-shadow:6px 0 20px rgba(0,0,0,0.35);
    display:flex; flex-direction:column;
    transform:translateX(-100%);
    transition:transform .18s ease;
    z-index:200;
  }
  #searchPanel.open{ transform:translateX(0); }
  #searchPanelHeader{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--toolbar-border);
  }
  #searchPanelTitle{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px; font-weight:600; color:var(--ink);
  }
  #searchPanelClose{
    flex:none; width:24px; height:24px; border-radius:6px;
    background:transparent; border:none; color:var(--muted);
    font-size:16px; cursor:pointer; line-height:24px; text-align:center;
  }
  #searchPanelClose:hover{ background:#242a35; color:var(--ink); }
  #searchPanelList{ flex:1; overflow-y:auto; }
  .searchResultItem{
    padding:10px 16px; cursor:pointer;
    border-bottom:1px solid var(--toolbar-border);
    border-left:3px solid transparent;
    font-family:'Inter', sans-serif;
  }
  .searchResultItem:hover{ background:#242a35; }
  .searchResultItem.active{ background:#2c3340; border-left-color:var(--accent); }
  .searchResultText{ font-size:13.5px; color:var(--ink); font-weight:500; }
  .searchResultMeta{ font-size:11px; color:var(--muted); margin-top:2px; }
  .searchResultEmpty{
    padding:16px; font-size:12.5px; color:var(--muted); text-align:center;
  }

  /* ---------- Canvas ---------- */
  #canvasWrapper{
    position:absolute; top:60px; left:0; right:0; bottom:0;
    overflow:hidden;
    cursor:grab;
    background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    background-position: 0 0;
  }
  #canvasWrapper.panning{ cursor:grabbing; }
  #canvasWrapper.select-mode{ cursor:crosshair; }
  #selectionBox{
    position:absolute;
    border:1.5px dashed var(--accent);
    background:rgba(94,184,164,0.14);
    display:none;
    pointer-events:none;
    z-index:50;
  }
  #canvas{
    position:relative;
    width:40000px; height:40000px;
    transform-origin: 0 0;
  }
  svg#connLayer{
    position:absolute; top:0; left:0; width:1px; height:1px;
    overflow:visible;
    pointer-events:none;
  }
  svg#connLayer .hit{ pointer-events:stroke; cursor:pointer; }
  svg#connLayer .connBridge{ fill:transparent; pointer-events:auto; }
  svg#connLayer .connLabelBg{ fill:#1b1f27; }
  svg#connLayer .connLabelTxt{
    fill:var(--muted); font-size:15px; font-family:'Inter', sans-serif; font-weight:500;
    pointer-events:auto; cursor:text;
  }
  svg#connLayer .connLine{ stroke:var(--accent-dim); stroke-width:3.5; }
  svg#connLayer .connLine.selected{ stroke:var(--accent); stroke-width:5; }
  svg#connLayer .connX{
    fill:#2c3340; stroke:var(--toolbar-border); cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .12s;
  }
  svg#connLayer .connXTxt{
    fill:var(--muted); font-size:11px; text-anchor:middle;
    opacity:0; pointer-events:none; transition:opacity .12s;
  }
  svg#connLayer .conn:hover .connX{ opacity:1; pointer-events:auto; }
  svg#connLayer .conn:hover .connXTxt{ opacity:1; }
  svg#connLayer .connNote{
    fill:#2c3340; stroke:var(--toolbar-border); cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .12s;
  }
  svg#connLayer .connNote.has-notes{
    fill:var(--accent-dim); stroke:var(--accent);
    opacity:1; pointer-events:auto;
  }
  svg#connLayer .conn:hover .connNote{ opacity:1; pointer-events:auto; }
  svg#connLayer .connNoteTxt{
    font-size:10px; text-anchor:middle;
    opacity:0; pointer-events:none; transition:opacity .12s;
  }
  svg#connLayer .connNoteTxt.has-notes{ opacity:1; }
  svg#connLayer .conn:hover .connNoteTxt{ opacity:1; }

  /* ---------- Nodes ---------- */
  .node{
    position:absolute;
    min-width:120px; max-width:260px;
    background:var(--node-color, var(--node-bg));
    border:1.5px solid var(--node-border);
    border-radius:10px;
    padding:10px 14px;
    box-shadow:0 3px 10px rgba(0,0,0,0.28);
    cursor:grab;
    user-select:none;
    z-index:5;
  }
  .node.dragging{ cursor:grabbing; box-shadow:0 8px 20px rgba(0,0,0,0.4); z-index:20; }
  .node.connectSelected{ outline:2.5px solid var(--accent); outline-offset:2px; }
  .node.connectMode{ cursor:crosshair; }
  .node.has-checkbox{ display:flex; align-items:center; gap:9px; }

  /* ---------- Node shapes ---------- */
  .node.shape-rectangle{ border-radius:3px; }
  .node.shape-square{
    width:98px; height:98px; min-width:98px; max-width:98px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .node.shape-square .node-text{ text-align:center; }
  .node.shape-circle{
    width:106px; height:106px; min-width:106px; max-width:106px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; padding:12px;
  }
  .node.shape-circle .node-text{ max-width:66px; text-align:center; }
  .node.shape-diamond{
    width:118px; height:118px; min-width:118px; max-width:118px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; box-shadow:none;
    padding:24px;
  }
  .node.shape-diamond .node-text{ text-align:center; }
  .node.shape-diamond::before{
    content:'';
    position:absolute; inset:0;
    background:var(--node-color, var(--node-bg));
    border:1.5px solid var(--node-border);
    border-radius:8px;
    box-shadow:0 3px 10px rgba(0,0,0,0.28);
    transform:rotate(45deg);
    z-index:-1;
  }
  .node.shape-cloud{
    position:relative;
    border:none;
    border-radius: 50% 50% 40px 40px / 65% 65% 30% 30%;
    box-shadow:0 3px 10px rgba(0,0,0,0.28);
    padding:20px 26px 16px;
  }
  .node.shape-cloud::before,
  .node.shape-cloud::after{
    content:'';
    position:absolute;
    background:inherit;
    border-radius:50%;
  }
  .node.shape-cloud::before{ width:44%; height:78%; top:-42%; left:10%; }
  .node.shape-cloud::after{ width:38%; height:66%; top:-34%; right:12%; }
  .node.shape-cloud .node-text{ position:relative; z-index:1; }
  .node.shape-text{
    background:transparent; border:none; box-shadow:none;
    padding:6px 4px;
  }
  .node.shape-text:hover{ background:rgba(255,255,255,0.05); border-radius:6px; }
  .node.shape-text .node-text{ color:#ffffff; }

  .node-checkbox{
    flex:none; width:19px; height:19px; margin:0;
    accent-color: var(--accent-dim);
    cursor:pointer;
  }
  .node-text{
    font-family:'Caveat', cursive;
    font-size:22px; font-weight:700; line-height:1.25;
    color:var(--node-text);
    outline:none;
    word-break:break-word;
    cursor:text;
    min-height:1.2em;
    text-align:center;
    flex:1;
  }
  .node.has-checkbox .node-text{ text-align:left; }
  .node-text.checked-text{ opacity:0.5; text-decoration:line-through; }
  .node-del{
    position:absolute; top:-9px; right:-9px;
    width:20px; height:20px; border-radius:50%;
    background:var(--danger); color:#fff;
    font-size:13px; line-height:20px; text-align:center;
    cursor:pointer; opacity:0; transition:opacity .12s;
    font-family:'Inter', sans-serif;
    z-index:3;
  }
  .node:hover .node-del{ opacity:0.9; }
  .node-del:hover{ opacity:1 !important; background:#e07771; }

  .node-add{
    position:absolute;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent); color:#0d1712;
    font-size:15px; font-weight:700; line-height:22px; text-align:center;
    cursor:pointer; opacity:0; transition:opacity .12s, transform .12s;
    font-family:'Inter', sans-serif;
    z-index:3;
  }
  .node-add:hover{ opacity:1 !important; transform:scale(1.12); background:#6ec3b0; }
  .node:hover .node-add{ opacity:0.9; }
  .node-add.right{ top:50%; right:-11px; margin-top:-11px; }
  .node-add.left{ top:50%; left:-11px; margin-top:-11px; }
  .node-add.bottom{ bottom:-11px; left:50%; margin-left:-11px; }
  .node-add.top{ top:-11px; left:50%; margin-left:-11px; }

  .node.selected{
    box-shadow:0 0 0 3px rgba(94,184,164,0.55), 0 3px 10px rgba(0,0,0,0.28);
  }

  /* ---------- Background container ---------- */
  .container{
    position:absolute;
    border:2px dashed var(--muted);
    background:rgba(255,255,255,0.03);
    border-radius:14px;
    z-index:1;
    cursor:grab;
  }
  .container.dragging{ cursor:grabbing; }
  .container.selected{ border-color:var(--accent); background:rgba(94,184,164,0.06); }
  .container-label{
    position:absolute; top:-14px; left:16px;
    background:var(--toolbar); border:1px solid var(--toolbar-border);
    border-radius:6px; padding:3px 10px;
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
    color:var(--muted);
    outline:none; cursor:text; white-space:nowrap;
    max-width:70%; overflow:hidden; text-overflow:ellipsis;
  }
  .container-label:focus{ color:var(--ink); overflow:visible; white-space:normal; }
  .container-del{
    position:absolute; top:-9px; right:-9px;
    width:20px; height:20px; border-radius:50%;
    background:var(--danger); color:#fff;
    font-size:13px; line-height:20px; text-align:center;
    cursor:pointer; opacity:0; transition:opacity .12s;
    font-family:'Inter', sans-serif;
    z-index:3;
  }
  .container:hover .container-del{ opacity:0.9; }
  .container-del:hover{ opacity:1 !important; background:#e07771; }
  .container-resize{
    position:absolute; right:-6px; bottom:-6px;
    width:16px; height:16px; border-radius:4px;
    background:var(--toolbar-border);
    cursor:nwse-resize;
    opacity:0; transition:opacity .12s;
  }
  .container:hover .container-resize{ opacity:0.9; }
  .container-resize:hover{ opacity:1 !important; background:var(--accent); }
  @keyframes searchFlash{
    0%{ box-shadow:0 0 0 0 rgba(94,184,164,0.85); }
    70%{ box-shadow:0 0 0 16px rgba(94,184,164,0); }
    100%{ box-shadow:0 0 0 0 rgba(94,184,164,0); }
  }
  .node.search-flash{ animation: searchFlash 1s ease-out 1; }
  .node.multi-selected{
    outline:2.5px dashed var(--accent);
    outline-offset:3px;
  }
  .node-note-badge{
    position:absolute; bottom:-8px; left:-8px;
    width:19px; height:19px; border-radius:50%;
    background:#242a35; border:1.5px solid var(--toolbar-border);
    font-size:11px; line-height:16px; text-align:center;
    color:var(--accent); pointer-events:none;
    z-index:3;
  }
  .container-note-badge{
    position:absolute; bottom:-9px; left:16px;
    width:19px; height:19px; border-radius:50%;
    background:#242a35; border:1.5px solid var(--toolbar-border);
    font-size:11px; line-height:16px; text-align:center;
    color:var(--accent); pointer-events:none;
    z-index:3;
  }

  /* connection label edit input */
  #connEditor{
    position:absolute;
    font-family:'Inter', sans-serif; font-size:14.5px;
    padding:3px 6px; border-radius:5px;
    border:1.5px solid var(--accent);
    background:#0f1216; color:var(--ink);
    outline:none; z-index:30;
    min-width:60px;
  }

  /* ---------- Notes side panel ---------- */
  #notesPanel{
    position:fixed; top:60px; right:0; bottom:0;
    width:320px;
    background:var(--toolbar);
    border-left:1px solid var(--toolbar-border);
    box-shadow:-6px 0 20px rgba(0,0,0,0.35);
    display:flex; flex-direction:column;
    transform:translateX(100%);
    transition:transform .18s ease;
    z-index:200;
  }
  #notesPanel.open{ transform:translateX(0); }
  #notesPanelHeader{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px; padding:14px 16px 10px;
    border-bottom:1px solid var(--toolbar-border);
  }
  #notesPanelTitle{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px; font-weight:600; color:var(--ink);
    line-height:1.3; word-break:break-word;
  }
  #notesPanelSub{
    font-size:11.5px; color:var(--muted); margin-top:3px;
  }
  #notesPanelClose{
    flex:none; width:24px; height:24px; border-radius:6px;
    background:transparent; border:none; color:var(--muted);
    font-size:16px; cursor:pointer; line-height:24px; text-align:center;
  }
  #notesPanelClose:hover{ background:#242a35; color:var(--ink); }
  #lineStyleRow{
    display:none;
    padding:12px 16px 0;
  }
  #lineStyleRow label{
    display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px;
  }
  #lineStyleSelect{
    width:100%; font-family:'Inter', sans-serif; font-size:13px;
    padding:7px 8px; border-radius:6px;
    background:#12151a; color:var(--ink);
    border:1.5px solid var(--toolbar-border); outline:none;
  }
  #lineStyleSelect:focus{ border-color:var(--accent); }
  #lineColorRow{ margin-top:12px; }
  #lineColorPicker{
    width:100%; height:34px; padding:3px;
    background:#12151a; border:1.5px solid var(--toolbar-border);
    border-radius:6px; cursor:pointer; margin-top:5px;
  }
  #lineColorPicker::-webkit-color-swatch-wrapper{ padding:2px; }
  #lineColorPicker::-webkit-color-swatch{ border:none; border-radius:4px; }
  #nodeColorRow{ margin-top:12px; }
  #nodeColorRow label{
    display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px;
  }
  #nodeColorPicker{
    width:100%; height:34px; padding:3px;
    background:#12151a; border:1.5px solid var(--toolbar-border);
    border-radius:6px; cursor:pointer;
  }
  #nodeColorPicker::-webkit-color-swatch-wrapper{ padding:2px; }
  #nodeColorPicker::-webkit-color-swatch{ border:none; border-radius:4px; }
  #nodeCheckboxRow{ margin-top:14px; }
  .checkboxRowLabel{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--ink); cursor:pointer;
  }
  #nodeCheckboxToggle{
    width:17px; height:17px; margin:0; cursor:pointer;
    accent-color: var(--accent-dim);
  }
  #containerOptionsRow{
    display:none;
    padding:12px 16px 0;
  }
  #containerOptionsRow label{
    display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px;
  }
  #containerBgPicker, #containerBorderPicker{
    width:100%; height:34px; padding:3px;
    background:#12151a; border:1.5px solid var(--toolbar-border);
    border-radius:6px; cursor:pointer;
  }
  #containerBgPicker::-webkit-color-swatch-wrapper,
  #containerBorderPicker::-webkit-color-swatch-wrapper{ padding:2px; }
  #containerBgPicker::-webkit-color-swatch,
  #containerBorderPicker::-webkit-color-swatch{ border:none; border-radius:4px; }
  #containerBorderRow{ margin-top:12px; }
  #nodeShapeRow{
    display:none;
    padding:12px 16px 0;
  }
  #nodeShapeRow label{
    display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px;
  }
  #nodeShapeSelect{
    width:100%; font-family:'Inter', sans-serif; font-size:13px;
    padding:7px 8px; border-radius:6px;
    background:#12151a; color:var(--ink);
    border:1.5px solid var(--toolbar-border); outline:none;
  }
  #nodeShapeSelect:focus{ border-color:var(--accent); }
  #notesTextarea{
    flex:1; margin:14px 16px 16px; padding:12px;
    background:#12151a; color:var(--ink);
    border:1.5px solid var(--toolbar-border); border-radius:8px;
    font-family:'Inter', sans-serif; font-size:13.5px; line-height:1.5;
    resize:none; outline:none;
  }
  #notesTextarea:focus{ border-color:var(--accent); }

  #empty{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:var(--muted); font-size:14px; text-align:center; pointer-events:none;
    width:300px; z-index:1;
  }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Mind Map</h1>
  <span id="fileIndicator" title="Not saved to a file yet"><span class="dot"></span><span id="fileNameLabel">Untitled</span></span>
  <button class="btn primary" id="addNodeBtn">+ Node</button>
  <button class="btn" id="addContainerBtn" title="Add a background container that other nodes can sit inside">🔲 + Container</button>
  <button class="btn" id="connectBtn" title="Connect two nodes">🔗 Connect</button>
  <button class="btn" id="dragModeBtn" title="Switch what dragging empty canvas does">🖐 Move</button>
  <div id="zoomControls">
    <button id="zoomOutBtn" title="Zoom out">−</button>
    <span id="zoomLabel" title="Reset zoom">100%</span>
    <button id="zoomInBtn" title="Zoom in">+</button>
  </div>
  <div id="searchWrap">
    <input type="text" id="searchInput" placeholder="🔍 Search…" autocomplete="off">
  </div>
  <span id="hint"></span>
  <div class="spacer"></div>
  <button class="btn" id="saveBtn" title="Save now (autosaves automatically after this)">💾 Save</button>
  <select id="fileMenu" class="btn ghost" title="File actions">
    <option value="" selected disabled>File ▾</option>
    <option value="new">New</option>
    <option value="saveas">Save As</option>
    <option value="load">Load</option>
    <option value="clear">Clear</option>
  </select>
  <input type="file" id="fileInput" accept="application/json">
</div>

<div id="canvasWrapper">
  <div id="empty">Click <strong>+ Node</strong> to add your first idea.<br>Drag an empty area to select nodes, scroll to pan, pinch or Ctrl+scroll to zoom.<br>Use <strong>Connect Nodes</strong> to link ideas together.</div>
  <div id="canvas">
    <svg id="connLayer"></svg>
  </div>
  <div id="selectionBox"></div>
</div>

<div id="searchPanel">
  <div id="searchPanelHeader">
    <div id="searchPanelTitle">Search Results</div>
    <button id="searchPanelClose" title="Close">×</button>
  </div>
  <div id="searchPanelList"></div>
</div>

<div id="notesPanel">
  <div id="notesPanelHeader">
    <div>
      <div id="notesPanelTitle">Node</div>
      <div id="notesPanelSub">Supplemental note</div>
    </div>
    <button id="notesPanelClose" title="Close">×</button>
  </div>
  <div id="nodeShapeRow">
    <label for="nodeShapeSelect">Shape</label>
    <select id="nodeShapeSelect">
      <option value="">Default</option>
      <option value="rectangle">Rectangle</option>
      <option value="square">Square</option>
      <option value="circle">Circle</option>
      <option value="diamond">Diamond</option>
      <option value="cloud">Cloud</option>
      <option value="text">Text only, no shape</option>
    </select>
    <div id="nodeColorRow">
      <label for="nodeColorPicker">Background color</label>
      <input type="color" id="nodeColorPicker" value="#f6f1e6">
    </div>
    <div id="nodeCheckboxRow">
      <label class="checkboxRowLabel">
        <input type="checkbox" id="nodeCheckboxToggle">
        Show a checkbox on this node
      </label>
    </div>
  </div>
  <div id="lineStyleRow">
    <label for="lineStyleSelect">Line style</label>
    <select id="lineStyleSelect">
      <option value="solid">Solid, no arrows</option>
      <option value="dashed">Dashed, no arrows</option>
      <option value="arrow">Single arrow</option>
      <option value="arrow-double">Double arrow</option>
    </select>
    <div id="lineColorRow">
      <label for="lineColorPicker">Line color</label>
      <input type="color" id="lineColorPicker" value="#3d7d70">
    </div>
  </div>
  <div id="containerOptionsRow">
    <label for="containerBgPicker">Background color</label>
    <input type="color" id="containerBgPicker" value="#1a1c20">
    <div id="containerBorderRow">
      <label for="containerBorderPicker">Outline color</label>
      <input type="color" id="containerBorderPicker" value="#8b93a1">
    </div>
  </div>
  <textarea id="notesTextarea" placeholder="Add a note…"></textarea>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const wrapper = document.getElementById('canvasWrapper');
  const svg = document.getElementById('connLayer');
  const emptyMsg = document.getElementById('empty');
  const hint = document.getElementById('hint');

  // Redraws connections whenever any observed node's rendered box actually
  // changes size, for any reason (font swap, live typing, shape change,
  // checkbox toggle, etc.) — catches the whole class of "stale connection"
  // bugs rather than each individual cause one at a time.
  const nodeResizeObserver = (typeof ResizeObserver !== 'undefined')
    ? new ResizeObserver(() => drawConnections())
    : { observe(){} };

  let nodes = [];       // {id, x, y, text, notes, color}
  let connections = []; // {id, from, to, text, notes, lineStyle}
  let containers = [];  // {id, x, y, w, h, text}
  let idCounter = 1;
  const nextId = () => 'n' + (idCounter++);
  const nextContainerId = () => 'g' + (idCounter++);

  let connectMode = false;
  let connectFrom = null;
  let selectedType = null; // 'node' | 'connection' | null
  let selectedId = null;
  let multiSelected = new Set(); // ids of nodes highlighted by rubber-band selection

  function clearMultiSelection(){
    if(!multiSelected.size) return;
    multiSelected.clear();
    canvas.querySelectorAll('.node.multi-selected').forEach(el => el.classList.remove('multi-selected'));
  }

  function clearContainerSelection(){
    canvas.querySelectorAll('.container.selected').forEach(el => el.classList.remove('selected'));
  }

  // ---------- Pan & zoom (infinite canvas) ----------
  const MIN_SCALE = 0.02, MAX_SCALE = 20;
  let scale = 1, panX = 0, panY = 0;
  const zoomLabel = document.getElementById('zoomLabel');

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function applyTransform(){
    canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    wrapper.style.backgroundPosition = panX + 'px ' + panY + 'px';
    wrapper.style.backgroundSize = (26*scale) + 'px ' + (26*scale) + 'px';
    zoomLabel.textContent = Math.round(scale*100) + '%';
  }

  function screenToWorld(sx, sy){
    return { x: (sx - panX) / scale, y: (sy - panY) / scale };
  }

  function zoomAt(cx, cy, factor){
    const newScale = clamp(scale * factor, MIN_SCALE, MAX_SCALE);
    const world = screenToWorld(cx, cy);
    panX = cx - world.x * newScale;
    panY = cy - world.y * newScale;
    scale = newScale;
    applyTransform();
  }

  function centerOfWrapper(){
    const rect = wrapper.getBoundingClientRect();
    return { x: rect.width/2, y: rect.height/2, rect };
  }

  document.getElementById('zoomInBtn').addEventListener('click', () => {
    const c = centerOfWrapper();
    zoomAt(c.x, c.y, 1.25);
  });
  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    const c = centerOfWrapper();
    zoomAt(c.x, c.y, 0.8);
  });
  zoomLabel.addEventListener('click', () => {
    const c = centerOfWrapper();
    zoomAt(c.x, c.y, 1/scale);
  });

  function goToNode(id){
    const el = canvas.querySelector('.node[data-id="'+id+'"]');
    if(!el) return;
    const cx = el.offsetLeft + el.offsetWidth/2;
    const cy = el.offsetTop + el.offsetHeight/2;
    const c = centerOfWrapper();
    panX = c.x - cx*scale;
    panY = c.y - cy*scale;
    applyTransform();
    selectNode(id);
    el.classList.remove('search-flash');
    void el.offsetWidth; // restart animation if triggered again on the same node
    el.classList.add('search-flash');
    setTimeout(() => el.classList.remove('search-flash'), 1100);
  }

  // ---------- Node search ----------
  const searchInput = document.getElementById('searchInput');
  const searchPanel = document.getElementById('searchPanel');
  const searchPanelList = document.getElementById('searchPanelList');
  document.getElementById('searchPanelClose').addEventListener('click', closeSearchPanel);

  function closeSearchPanel(){
    searchPanel.classList.remove('open');
    searchInput.value = '';
  }

  function runSearch(query){
    const q = query.trim().toLowerCase();
    searchPanelList.innerHTML = '';
    if(!q){
      searchPanel.classList.remove('open');
      return;
    }
    const matches = nodes.filter(n =>
      (n.text && n.text.toLowerCase().includes(q)) ||
      (n.notes && n.notes.toLowerCase().includes(q))
    ).slice(0, 50);

    if(!matches.length){
      const empty = document.createElement('div');
      empty.className = 'searchResultEmpty';
      empty.textContent = 'No matching nodes';
      searchPanelList.appendChild(empty);
      searchPanel.classList.add('open');
      return;
    }

    matches.forEach(n => {
      const item = document.createElement('div');
      item.className = 'searchResultItem';
      item.dataset.id = n.id;
      const textEl = document.createElement('div');
      textEl.className = 'searchResultText';
      textEl.textContent = n.text;
      item.appendChild(textEl);
      const inNotesOnly = !(n.text && n.text.toLowerCase().includes(q)) && n.notes;
      if(inNotesOnly){
        const meta = document.createElement('div');
        meta.className = 'searchResultMeta';
        meta.textContent = 'matched in note';
        item.appendChild(meta);
      }
      item.addEventListener('click', () => {
        searchPanelList.querySelectorAll('.searchResultItem').forEach(x => x.classList.remove('active'));
        item.classList.add('active');
        goToNode(n.id);
      });
      searchPanelList.appendChild(item);
    });
    searchPanel.classList.add('open');
  }

  searchInput.addEventListener('input', () => runSearch(searchInput.value));
  searchInput.addEventListener('keydown', e => {
    const items = Array.from(searchPanelList.querySelectorAll('.searchResultItem'));
    if(e.key === 'Escape'){
      closeSearchPanel();
      searchInput.blur();
      return;
    }
    if(!items.length) return;
    let idx = items.findIndex(it => it.classList.contains('active'));
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      idx = Math.min(idx + 1, items.length - 1);
      items.forEach(it => it.classList.remove('active'));
      items[idx].classList.add('active');
      items[idx].scrollIntoView({ block:'nearest' });
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      idx = Math.max(idx - 1, 0);
      items.forEach(it => it.classList.remove('active'));
      items[idx].classList.add('active');
      items[idx].scrollIntoView({ block:'nearest' });
    } else if(e.key === 'Enter'){
      e.preventDefault();
      items[idx >= 0 ? idx : 0].click();
    }
  });

  wrapper.addEventListener('wheel', e => {
    e.preventDefault();
    if(e.ctrlKey || e.metaKey){
      const rect = wrapper.getBoundingClientRect();
      const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
      const factor = Math.exp(-e.deltaY * 0.01);
      zoomAt(cx, cy, factor);
    } else {
      panX -= e.deltaX;
      panY -= e.deltaY;
      applyTransform();
    }
  }, { passive:false });

  // drag on empty canvas: either pans the view or rubber-band selects,
  // depending on dragMode. Default is 'move' (pan).
  let dragMode = 'move'; // 'move' | 'select'
  const selectionBox = document.getElementById('selectionBox');
  let dragging2 = false, dragStartX, dragStartY, panStartPanX, panStartPanY, selRect = null;

  wrapper.addEventListener('pointerdown', e => {
    if(e.target !== wrapper && e.target !== canvas && e.target !== svg) return;
    if(connectMode) return;
    dragging2 = true;
    wrapper.setPointerCapture(e.pointerId);
    dragStartX = e.clientX; dragStartY = e.clientY;
    if(dragMode === 'move'){
      wrapper.classList.add('panning');
      panStartPanX = panX; panStartPanY = panY;
    } else {
      selectionBox.style.display = 'block';
      updateSelectionBox(e.clientX, e.clientY);
    }
  });
  function updateSelectionBox(curX, curY){
    const rect = wrapper.getBoundingClientRect();
    const x1 = Math.min(dragStartX, curX), x2 = Math.max(dragStartX, curX);
    const y1 = Math.min(dragStartY, curY), y2 = Math.max(dragStartY, curY);
    selectionBox.style.left = (x1 - rect.left) + 'px';
    selectionBox.style.top = (y1 - rect.top) + 'px';
    selectionBox.style.width = (x2 - x1) + 'px';
    selectionBox.style.height = (y2 - y1) + 'px';
    selRect = { x1, y1, x2, y2 };
  }
  function updateLiveSelection(){
    if(!selRect) return;
    canvas.querySelectorAll('.node').forEach(el => {
      const b = el.getBoundingClientRect();
      const intersects = !(b.right < selRect.x1 || b.left > selRect.x2 || b.bottom < selRect.y1 || b.top > selRect.y2);
      el.classList.toggle('multi-selected', intersects);
    });
  }
  wrapper.addEventListener('pointermove', e => {
    if(!dragging2) return;
    if(dragMode === 'move'){
      panX = panStartPanX + (e.clientX - dragStartX);
      panY = panStartPanY + (e.clientY - dragStartY);
      applyTransform();
    } else {
      updateSelectionBox(e.clientX, e.clientY);
      updateLiveSelection();
    }
  });
  function stopDrag(e){
    if(!dragging2) return;
    dragging2 = false;
    const dist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
    if(dragMode === 'move'){
      wrapper.classList.remove('panning');
      if(dist < 5){
        clearMultiSelection();
        clearContainerSelection();
        closePanel();
      }
    } else {
      selectionBox.style.display = 'none';
      if(dist < 5){
        clearMultiSelection();
        clearContainerSelection();
        closePanel();
      } else {
        multiSelected = new Set(
          Array.from(canvas.querySelectorAll('.node.multi-selected')).map(el => el.dataset.id)
        );
      }
      selRect = null;
    }
  }
  wrapper.addEventListener('pointerup', stopDrag);
  wrapper.addEventListener('pointercancel', stopDrag);

  // ---------- Notes / line-style side panel ----------
  const notesPanel = document.getElementById('notesPanel');
  const notesPanelTitle = document.getElementById('notesPanelTitle');
  const notesPanelSub = document.getElementById('notesPanelSub');
  const notesTextarea = document.getElementById('notesTextarea');
  const lineStyleRow = document.getElementById('lineStyleRow');
  const lineStyleSelect = document.getElementById('lineStyleSelect');
  const lineColorPicker = document.getElementById('lineColorPicker');
  const nodeShapeRow = document.getElementById('nodeShapeRow');
  const nodeShapeSelect = document.getElementById('nodeShapeSelect');
  const nodeColorPicker = document.getElementById('nodeColorPicker');
  const nodeCheckboxToggle = document.getElementById('nodeCheckboxToggle');
  const containerOptionsRow = document.getElementById('containerOptionsRow');
  const containerBgPicker = document.getElementById('containerBgPicker');
  const containerBorderPicker = document.getElementById('containerBorderPicker');
  document.getElementById('notesPanelClose').addEventListener('click', closePanel);

  function selectNode(id){
    selectedType = 'node';
    selectedId = id;
    clearContainerSelection();
    canvas.querySelectorAll('.node.selected').forEach(x => x.classList.remove('selected'));
    const el = canvas.querySelector('.node[data-id="'+id+'"]');
    if(el) el.classList.add('selected');
    const n = nodes.find(n => n.id === id);
    if(!n) return;
    notesPanelTitle.textContent = n.text;
    notesPanelSub.textContent = 'Supplemental note';
    notesTextarea.value = n.notes || '';
    lineStyleRow.style.display = 'none';
    containerOptionsRow.style.display = 'none';
    nodeShapeRow.style.display = 'block';
    nodeShapeSelect.value = n.shape || '';
    nodeColorPicker.value = n.color || '#f6f1e6';
    nodeCheckboxToggle.checked = !!n.hasCheckbox;
    notesPanel.classList.add('open');
  }

  function selectConnection(id){
    selectedType = 'connection';
    selectedId = id;
    canvas.querySelectorAll('.node.selected').forEach(x => x.classList.remove('selected'));
    const c = connections.find(c => c.id === id);
    if(!c) return;
    const fromN = nodes.find(n => n.id === c.from);
    const toN = nodes.find(n => n.id === c.to);
    notesPanelTitle.textContent = c.text ? '\u201C' + c.text + '\u201D' : 'Connection';
    notesPanelSub.textContent = (fromN ? fromN.text : '?') + ' \u2192 ' + (toN ? toN.text : '?');
    notesTextarea.value = c.notes || '';
    nodeShapeRow.style.display = 'none';
    containerOptionsRow.style.display = 'none';
    lineStyleRow.style.display = 'block';
    lineStyleSelect.value = c.lineStyle || 'solid';
    lineColorPicker.value = c.lineColor || '#3d7d70';
    notesPanel.classList.add('open');
    drawConnections();
  }

  function selectContainer(id){
    selectedType = 'container';
    selectedId = id;
    canvas.querySelectorAll('.node.selected').forEach(x => x.classList.remove('selected'));
    const c = containers.find(c => c.id === id);
    if(!c) return;
    notesPanelTitle.textContent = c.text || 'Container';
    notesPanelSub.textContent = 'Container note';
    notesTextarea.value = c.notes || '';
    nodeShapeRow.style.display = 'none';
    lineStyleRow.style.display = 'none';
    containerOptionsRow.style.display = 'block';
    containerBgPicker.value = c.color || '#1a1c20';
    containerBorderPicker.value = c.borderColor || '#8b93a1';
    notesPanel.classList.add('open');
  }

  function closePanel(){
    const wasConnection = selectedType === 'connection';
    selectedType = null;
    selectedId = null;
    notesPanel.classList.remove('open');
    canvas.querySelectorAll('.node.selected').forEach(x => x.classList.remove('selected'));
    clearContainerSelection();
    nodeShapeRow.style.display = 'none';
    containerOptionsRow.style.display = 'none';
    if(wasConnection) drawConnections();
  }

  notesTextarea.addEventListener('input', () => {
    if(selectedType === 'node'){
      const n = nodes.find(n => n.id === selectedId);
      if(!n) return;
      n.notes = notesTextarea.value;
      const el = canvas.querySelector('.node[data-id="'+n.id+'"]');
      let badge = el ? el.querySelector('.node-note-badge') : null;
      if(n.notes.trim()){
        if(el && !badge){
          badge = document.createElement('div');
          badge.className = 'node-note-badge';
          badge.textContent = '\uD83D\uDCDD';
          el.appendChild(badge);
        }
      } else if(badge){
        badge.remove();
      }
      notifyChange();
    } else if(selectedType === 'connection'){
      const c = connections.find(c => c.id === selectedId);
      if(!c) return;
      c.notes = notesTextarea.value;
      drawConnections();
      notifyChange();
    } else if(selectedType === 'container'){
      const c = containers.find(c => c.id === selectedId);
      if(!c) return;
      c.notes = notesTextarea.value;
      const el = canvas.querySelector('.container[data-id="'+c.id+'"]');
      let badge = el ? el.querySelector('.container-note-badge') : null;
      if(c.notes.trim()){
        if(el && !badge){
          badge = document.createElement('div');
          badge.className = 'container-note-badge';
          badge.textContent = '\uD83D\uDCDD';
          el.appendChild(badge);
        }
      } else if(badge){
        badge.remove();
      }
      notifyChange();
    }
  });

  lineStyleSelect.addEventListener('change', () => {
    if(selectedType !== 'connection') return;
    const c = connections.find(c => c.id === selectedId);
    if(!c) return;
    c.lineStyle = lineStyleSelect.value;
    drawConnections();
    notifyChange();
  });

  lineColorPicker.addEventListener('input', () => {
    if(selectedType !== 'connection') return;
    const c = connections.find(c => c.id === selectedId);
    if(!c) return;
    c.lineColor = lineColorPicker.value;
    drawConnections();
    notifyChange();
  });

  nodeColorPicker.addEventListener('input', () => {
    if(selectedType !== 'node') return;
    const n = nodes.find(n => n.id === selectedId);
    if(!n) return;
    n.color = nodeColorPicker.value;
    const el = canvas.querySelector('.node[data-id="'+n.id+'"]');
    if(el) el.style.setProperty('--node-color', n.color);
    notifyChange();
  });

  nodeCheckboxToggle.addEventListener('change', () => {
    if(selectedType !== 'node') return;
    const n = nodes.find(n => n.id === selectedId);
    if(!n) return;
    n.hasCheckbox = nodeCheckboxToggle.checked;
    if(n.hasCheckbox && typeof n.checked !== 'boolean') n.checked = false;
    render();
    notifyChange();
  });

  containerBgPicker.addEventListener('input', () => {
    if(selectedType !== 'container') return;
    const c = containers.find(c => c.id === selectedId);
    if(!c) return;
    c.color = containerBgPicker.value;
    const el = canvas.querySelector('.container[data-id="'+c.id+'"]');
    if(el) el.style.background = c.color;
    notifyChange();
  });

  containerBorderPicker.addEventListener('input', () => {
    if(selectedType !== 'container') return;
    const c = containers.find(c => c.id === selectedId);
    if(!c) return;
    c.borderColor = containerBorderPicker.value;
    const el = canvas.querySelector('.container[data-id="'+c.id+'"]');
    if(el) el.style.borderColor = c.borderColor;
    notifyChange();
  });

  nodeShapeSelect.addEventListener('change', () => {
    if(selectedType !== 'node') return;
    const n = nodes.find(n => n.id === selectedId);
    if(!n) return;
    n.shape = nodeShapeSelect.value;
    render();
    notifyChange();
  });

  // ---------- File handling (save to the exact loaded file) ----------
  const fsAccessSupported = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;
  let fileHandle = null;
  let fileName = null;
  let autoSaveTimer = null;
  const fileIndicator = document.getElementById('fileIndicator');
  const fileNameLabel = document.getElementById('fileNameLabel');

  function setStatus(text, mode){
    fileIndicator.title = text;
    fileIndicator.className = mode || '';
  }
  function updateFileNameLabel(){
    fileNameLabel.textContent = fileName || 'Untitled';
    document.title = (fileName || 'Untitled mind map') + ' \u2013 Mind Map';
  }
  function refreshUnlinkedStatus(){
    setStatus(fsAccessSupported ? 'Not saved to a file yet' : 'This browser can only download copies', 'unsupported');
  }
  refreshUnlinkedStatus();

  function currentData(){
    return JSON.stringify({ nodes, connections, containers, idCounter }, null, 2);
  }

  async function writeToHandle(handle, data){
    const writable = await handle.createWritable();
    await writable.write(data);
    await writable.close();
  }

  function downloadCopy(data, suggestedName){
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = suggestedName || 'mindmap.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function sanitizeFileName(text){
    const cleaned = (text || '').trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 60);
    return (cleaned || 'mindmap') + '.json';
  }

  function dateFileName(){
    const d = new Date();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const yy = String(d.getFullYear()).slice(-2);
    return mm + dd + yy + '.json';
  }

  function commitActiveEdit(){
    const ae = document.activeElement;
    if(ae && ae.classList && (ae.classList.contains('node-text') || ae.id === 'connEditor')){
      ae.blur();
    }
  }

  async function saveFile(){
    commitActiveEdit();
    const data = currentData();
    if(fileHandle){
      try{
        await writeToHandle(fileHandle, data);
        setStatus('Saved');
      } catch(err){
        setStatus('Could not save \u2014 try again', 'unsupported');
      }
      return;
    }
    if(fsAccessSupported){
      try{
        const handle = await window.showSaveFilePicker({
          suggestedName: dateFileName(),
          types: [{ description:'Mind Map', accept:{'application/json':['.json']} }]
        });
        fileHandle = handle;
        fileName = handle.name;
        updateFileNameLabel();
        await writeToHandle(fileHandle, data);
        setStatus('Saved \u2014 autosaving from here');
      } catch(err){
        if(err.name !== 'AbortError') setStatus('Save cancelled', 'unsupported');
      }
      return;
    }
    downloadCopy(data, dateFileName());
  }

  async function saveFileAs(){
    commitActiveEdit();
    const data = currentData();
    if(fsAccessSupported){
      try{
        const handle = await window.showSaveFilePicker({
          suggestedName: fileName || dateFileName(),
          types: [{ description:'Mind Map', accept:{'application/json':['.json']} }]
        });
        fileHandle = handle;
        fileName = handle.name;
        updateFileNameLabel();
        await writeToHandle(fileHandle, data);
        setStatus('Saved as new file \u2014 autosaving from here');
      } catch(err){
        if(err.name !== 'AbortError') setStatus('Save cancelled', 'unsupported');
      }
      return;
    }
    downloadCopy(data, fileName || dateFileName());
  }

  async function loadFile(){
    if(fsAccessSupported){
      try{
        const [handle] = await window.showOpenFilePicker({
          types: [{ description:'Mind Map', accept:{'application/json':['.json']} }]
        });
        const file = await handle.getFile();
        const text = await file.text();
        if(applyLoadedData(text)){
          fileHandle = handle;
          fileName = handle.name;
          updateFileNameLabel();
          setStatus('Loaded \u2014 autosaving from here');
        }
      } catch(err){
        // user cancelled — ignore
      }
      return;
    }
    fileInput.click();
  }

  function applyLoadedData(text){
    try{
      const data = JSON.parse(text);
      nodes = Array.isArray(data.nodes) ? data.nodes : [];
      connections = Array.isArray(data.connections) ? data.connections : [];
      nodes.forEach(n => {
        if(typeof n.notes !== 'string') n.notes = '';
        if(typeof n.color !== 'string') n.color = '';
        if(typeof n.hasCheckbox !== 'boolean') n.hasCheckbox = false;
        if(typeof n.checked !== 'boolean') n.checked = false;
        if(typeof n.shape !== 'string') n.shape = '';
      });
      connections.forEach(c => {
        if(typeof c.notes !== 'string') c.notes = '';
        if(typeof c.lineStyle !== 'string') c.lineStyle = 'solid';
        if(typeof c.lineColor !== 'string') c.lineColor = '';
      });
      containers = Array.isArray(data.containers) ? data.containers : [];
      containers.forEach(c => {
        if(typeof c.text !== 'string') c.text = 'Container';
        if(typeof c.color !== 'string') c.color = '';
        if(typeof c.borderColor !== 'string') c.borderColor = '';
        if(typeof c.notes !== 'string') c.notes = '';
        if(typeof c.w !== 'number') c.w = 440;
        if(typeof c.h !== 'number') c.h = 300;
      });
      idCounter = data.idCounter || (nodes.length + connections.length + containers.length + 1);
      selectedType = null;
      selectedId = null;
      multiSelected.clear();
      closePanel();
      render();
      // guard against a stale first paint: node width depends on text
      // content and can shift slightly once fonts finish settling, so redraw
      // connections again once layout has had a moment to catch up.
      requestAnimationFrame(() => requestAnimationFrame(() => drawConnections()));
      return true;
    } catch(err){
      hint.textContent = 'Could not read that file — is it a saved mind map?';
      setTimeout(() => hint.textContent = '', 3000);
      return false;
    }
  }

  function notifyChange(){
    if(!fileHandle) return; // nothing loaded — no autosave target
    setStatus('Saving…', 'saving');
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(async () => {
      try{
        await writeToHandle(fileHandle, currentData());
        setStatus('Saved');
      } catch(err){
        setStatus('Could not autosave', 'unsupported');
      }
    }, 500);
  }

  // ---------- Rendering ----------
  function renderContainers(){
    canvas.querySelectorAll('.container').forEach(el => el.remove());
    containers.forEach(c => {
      const el = document.createElement('div');
      el.className = 'container';
      el.dataset.id = c.id;
      el.style.left = c.x + 'px';
      el.style.top = c.y + 'px';
      el.style.width = c.w + 'px';
      el.style.height = c.h + 'px';
      if(c.color) el.style.background = c.color;
      if(c.borderColor) el.style.borderColor = c.borderColor;
      if(selectedType === 'container' && selectedId === c.id) el.classList.add('selected');

      const label = document.createElement('div');
      label.className = 'container-label';
      label.contentEditable = 'true';
      label.spellcheck = false;
      label.textContent = c.text || 'Container';
      label.addEventListener('pointerdown', e => e.stopPropagation());
      label.addEventListener('blur', () => {
        c.text = label.textContent.trim() || 'Container';
        label.textContent = c.text;
        notifyChange();
      });
      label.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); label.blur(); }
      });
      el.appendChild(label);

      const del = document.createElement('div');
      del.className = 'container-del';
      del.textContent = '×';
      del.title = 'Delete container (keeps the nodes inside it)';
      del.addEventListener('pointerdown', e => e.stopPropagation());
      del.addEventListener('click', e => {
        e.stopPropagation();
        containers = containers.filter(x => x.id !== c.id);
        render();
        notifyChange();
      });
      el.appendChild(del);

      if(c.notes && c.notes.trim()){
        const badge = document.createElement('div');
        badge.className = 'container-note-badge';
        badge.textContent = '\uD83D\uDCDD';
        el.appendChild(badge);
      }

      const resize = document.createElement('div');
      resize.className = 'container-resize';
      resize.title = 'Resize';
      el.appendChild(resize);

      canvas.insertBefore(el, canvas.firstChild);
      makeContainerInteractive(el, c, resize);
    });
  }

  function nodesInside(c){
    return nodes.filter(n => {
      const el = canvas.querySelector('.node[data-id="'+n.id+'"]');
      const w = el ? el.offsetWidth : 160, h = el ? el.offsetHeight : 50;
      const cx = n.x + w/2, cy = n.y + h/2;
      return cx >= c.x && cx <= c.x + c.w && cy >= c.y && cy <= c.y + c.h;
    });
  }

  function makeContainerInteractive(el, c, resizeHandle){
    let startX, startY, origX, origY, dragging = false, resizing = false, origW, origH;
    let carried = null;

    el.addEventListener('pointerdown', e => {
      if(connectMode) return;
      if(e.target === resizeHandle || e.target.classList.contains('container-label') || e.target.classList.contains('container-del')) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origX = c.x; origY = c.y;
      carried = nodesInside(c).map(n => ({ n, x: n.x, y: n.y }));
    });
    el.addEventListener('pointermove', e => {
      if(!dragging) return;
      const dx = (e.clientX - startX) / scale;
      const dy = (e.clientY - startY) / scale;
      c.x = origX + dx; c.y = origY + dy;
      el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
      carried.forEach(item => {
        item.n.x = item.x + dx; item.n.y = item.y + dy;
        const nEl = canvas.querySelector('.node[data-id="'+item.n.id+'"]');
        if(nEl){ nEl.style.left = item.n.x + 'px'; nEl.style.top = item.n.y + 'px'; }
      });
      drawConnections();
    });
    function stopDrag(e){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
      if(dist < 5){
        clearMultiSelection();
        selectContainer(c.id);
        canvas.querySelectorAll('.container.selected').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
      } else {
        notifyChange();
      }
      carried = null;
    }
    el.addEventListener('pointerup', stopDrag);
    el.addEventListener('pointercancel', stopDrag);

    resizeHandle.addEventListener('pointerdown', e => {
      e.stopPropagation();
      resizing = true;
      resizeHandle.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origW = c.w; origH = c.h;
    });
    resizeHandle.addEventListener('pointermove', e => {
      if(!resizing) return;
      const dx = (e.clientX - startX) / scale;
      const dy = (e.clientY - startY) / scale;
      c.w = Math.max(160, origW + dx);
      c.h = Math.max(120, origH + dy);
      el.style.width = c.w + 'px'; el.style.height = c.h + 'px';
    });
    function stopResize(e){
      if(!resizing) return;
      resizing = false;
      notifyChange();
    }
    resizeHandle.addEventListener('pointerup', stopResize);
    resizeHandle.addEventListener('pointercancel', stopResize);
  }

  function render(){
    renderContainers();
    canvas.querySelectorAll('.node').forEach(n => n.remove());
    emptyMsg.style.display = (nodes.length || containers.length) ? 'none' : 'block';

    if(selectedType === 'node' && !nodes.find(n => n.id === selectedId)){
      closePanel();
    }

    nodes.forEach(n => {
      const el = document.createElement('div');
      const shapeClass = n.shape ? ' shape-' + n.shape : '';
      el.className = 'node' + (n.hasCheckbox ? ' has-checkbox' : '') + shapeClass;
      el.dataset.id = n.id;
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      if(n.color) el.style.setProperty('--node-color', n.color);

      let checkboxEl = null;
      if(n.hasCheckbox){
        checkboxEl = document.createElement('input');
        checkboxEl.type = 'checkbox';
        checkboxEl.className = 'node-checkbox';
        checkboxEl.checked = !!n.checked;
        checkboxEl.title = 'Mark done';
        checkboxEl.addEventListener('pointerdown', e => e.stopPropagation());
        checkboxEl.addEventListener('click', e => e.stopPropagation());
        checkboxEl.addEventListener('change', () => {
          n.checked = checkboxEl.checked;
          txt.classList.toggle('checked-text', n.checked);
          notifyChange();
        });
      }

      const del = document.createElement('div');
      del.className = 'node-del';
      del.textContent = '×';
      del.title = 'Delete node';
      del.addEventListener('pointerdown', e => e.stopPropagation());
      del.addEventListener('click', e => {
        e.stopPropagation();
        deleteNode(n.id);
      });

      const txt = document.createElement('div');
      txt.className = 'node-text' + (n.hasCheckbox && n.checked ? ' checked-text' : '');
      txt.contentEditable = 'true';
      txt.spellcheck = false;
      txt.textContent = n.text;
      txt.addEventListener('pointerdown', e => e.stopPropagation());
      txt.addEventListener('input', () => drawConnections());
      txt.addEventListener('blur', () => {
        n.text = txt.textContent.trim() || 'Untitled';
        txt.textContent = n.text;
        if(selectedType === 'node' && selectedId === n.id) notesPanelTitle.textContent = n.text;
        if(selectedType === 'connection'){
          const c = connections.find(c => c.id === selectedId);
          if(c && (c.from === n.id || c.to === n.id)){
            const fromN = nodes.find(x => x.id === c.from);
            const toN = nodes.find(x => x.id === c.to);
            notesPanelSub.textContent = (fromN ? fromN.text : '?') + ' \u2192 ' + (toN ? toN.text : '?');
          }
        }
        drawConnections();
        notifyChange();
      });
      txt.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); txt.blur(); }
      });

      el.appendChild(txt);
      if(checkboxEl) el.insertBefore(checkboxEl, txt);
      el.appendChild(del);

      ['right','bottom','left','top'].forEach(dir => {
        const add = document.createElement('div');
        add.className = 'node-add ' + dir;
        add.textContent = '+';
        add.title = 'Add connected node';
        add.addEventListener('pointerdown', e => e.stopPropagation());
        add.addEventListener('click', e => {
          e.stopPropagation();
          addConnectedNode(n, dir);
        });
        el.appendChild(add);
      });

      if(n.notes && n.notes.trim()){
        const badge = document.createElement('div');
        badge.className = 'node-note-badge';
        badge.textContent = '\uD83D\uDCDD';
        el.appendChild(badge);
      }

      if(selectedType === 'node' && n.id === selectedId) el.classList.add('selected');
      if(multiSelected.has(n.id)) el.classList.add('multi-selected');

      canvas.appendChild(el);
      nodeResizeObserver.observe(el);

      makeDraggable(el, n);

      el.addEventListener('click', e => {
        if(!connectMode) return;
        e.stopPropagation();
        handleConnectClick(n.id, el);
      });
    });

    drawConnections();
  }

  function nodeCenter(id){
    const el = canvas.querySelector('.node[data-id="'+id+'"]');
    if(!el) return null;
    return {
      x: el.offsetLeft + el.offsetWidth/2,
      y: el.offsetTop + el.offsetHeight/2,
      w: el.offsetWidth,
      h: el.offsetHeight
    };
  }

  function clipToRect(cx, cy, halfW, halfH, dirX, dirY){
    if(dirX === 0 && dirY === 0) return { x:cx, y:cy };
    const tX = halfW / Math.max(Math.abs(dirX), 1e-6);
    const tY = halfH / Math.max(Math.abs(dirY), 1e-6);
    const t = Math.min(tX, tY);
    return { x: cx + dirX*t, y: cy + dirY*t };
  }

  function drawConnections(){
    svg.innerHTML = '<defs><marker id="mmArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3d7d70"></path></marker><marker id="mmArrowSel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5eb8a4"></path></marker></defs>';
    const defsEl = svg.querySelector('defs');
    const knownMarkers = new Set(['mmArrow', 'mmArrowSel']);
    function markerFor(colorHex){
      const id = 'mmArrow-' + colorHex.replace('#', '').toLowerCase();
      if(!knownMarkers.has(id)){
        const m = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        m.setAttribute('id', id);
        m.setAttribute('viewBox', '0 0 10 10');
        m.setAttribute('refX', '8.5'); m.setAttribute('refY', '5');
        m.setAttribute('markerWidth', '8'); m.setAttribute('markerHeight', '8');
        m.setAttribute('markerUnits', 'userSpaceOnUse');
        m.setAttribute('orient', 'auto-start-reverse');
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,0 L10,5 L0,10 Z');
        p.setAttribute('fill', colorHex);
        m.appendChild(p);
        defsEl.appendChild(m);
        knownMarkers.add(id);
      }
      return id;
    }
    if(selectedType === 'connection' && !connections.find(c => c.id === selectedId)){
      closePanel();
    }
    connections.forEach(c => {
      const a = nodeCenter(c.from);
      const b = nodeCenter(c.to);
      if(!a || !b) return;

      const dx0 = b.x - a.x, dy0 = b.y - a.y;
      const len = Math.hypot(dx0, dy0) || 1;
      const ndx = dx0/len, ndy = dy0/len;
      const aEdge = clipToRect(a.x, a.y, a.w/2, a.h/2, ndx, ndy);
      const bEdge = clipToRect(b.x, b.y, b.w/2, b.h/2, -ndx, -ndy);

      const isSelected = selectedType==='connection' && selectedId===c.id;
      const customColor = c.lineColor && !isSelected ? c.lineColor : '';

      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class', 'conn');

      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', aEdge.x); line.setAttribute('y1', aEdge.y);
      line.setAttribute('x2', bEdge.x); line.setAttribute('y2', bEdge.y);
      line.setAttribute('class', 'connLine' + (isSelected ? ' selected' : ''));
      if(customColor) line.style.stroke = customColor;
      const style = c.lineStyle || 'solid';
      if(style === 'dashed') line.setAttribute('stroke-dasharray', '10 8');
      const markerId = isSelected ? 'mmArrowSel' : (customColor ? markerFor(customColor) : 'mmArrow');
      if(style === 'arrow' || style === 'arrow-double') line.setAttribute('marker-end', 'url(#'+markerId+')');
      if(style === 'arrow-double') line.setAttribute('marker-start', 'url(#'+markerId+')');
      g.appendChild(line);

      const hit = document.createElementNS('http://www.w3.org/2000/svg','line');
      hit.setAttribute('x1', aEdge.x); hit.setAttribute('y1', aEdge.y);
      hit.setAttribute('x2', bEdge.x); hit.setAttribute('y2', bEdge.y);
      hit.setAttribute('class','hit');
      hit.setAttribute('stroke','transparent');
      hit.setAttribute('stroke-width','18');
      hit.addEventListener('click', () => openConnEditor(c));
      g.appendChild(hit);

      const mx = (aEdge.x+bEdge.x)/2, my = (aEdge.y+bEdge.y)/2;
      const labelWidth = c.text ? Math.max(28, c.text.length * 8.2 + 26) : 0;
      const halfLabel = c.text ? labelWidth/2 : 6;
      const dx = halfLabel + 12;

      // invisible bridge so hover stays active while moving from the
      // line/label toward the delete and note icons, even on angled lines.
      // Also opens the quick label editor, same as clicking the line itself —
      // the delete/note icons paint on top and still take priority for clicks.
      const bridge = document.createElementNS('http://www.w3.org/2000/svg','rect');
      bridge.setAttribute('x', mx - dx - 12);
      bridge.setAttribute('y', my - 15);
      bridge.setAttribute('width', (dx + 12) * 2);
      bridge.setAttribute('height', 30);
      bridge.setAttribute('class', 'connBridge');
      bridge.addEventListener('click', () => openConnEditor(c));
      g.appendChild(bridge);

      if(c.text){
        const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
        bg.setAttribute('x', mx - labelWidth/2); bg.setAttribute('y', my - 13);
        bg.setAttribute('width', labelWidth); bg.setAttribute('height', 26);
        bg.setAttribute('rx', 7);
        bg.setAttribute('class','connLabelBg');
        bg.addEventListener('click', () => openConnEditor(c));
        g.appendChild(bg);

        const tEl = document.createElementNS('http://www.w3.org/2000/svg','text');
        tEl.setAttribute('x', mx); tEl.setAttribute('y', my + 5);
        tEl.setAttribute('text-anchor','middle');
        tEl.setAttribute('class','connLabelTxt');
        tEl.textContent = c.text;
        tEl.addEventListener('click', () => openConnEditor(c));
        g.appendChild(tEl);
      }

      const delC = document.createElementNS('http://www.w3.org/2000/svg','circle');
      delC.setAttribute('cx', mx + dx); delC.setAttribute('cy', my);
      delC.setAttribute('r', 8);
      delC.setAttribute('class','connX');
      delC.addEventListener('click', () => deleteConnection(c.id));
      g.appendChild(delC);

      const delT = document.createElementNS('http://www.w3.org/2000/svg','text');
      delT.setAttribute('x', mx + dx); delT.setAttribute('y', my + 3.5);
      delT.setAttribute('class','connXTxt');
      delT.textContent = '×';
      delT.style.pointerEvents = 'none';
      g.appendChild(delT);

      const hasNotes = !!(c.notes && c.notes.trim());

      const noteX = mx - dx;
      const noteC = document.createElementNS('http://www.w3.org/2000/svg','circle');
      noteC.setAttribute('cx', noteX); noteC.setAttribute('cy', my);
      noteC.setAttribute('r', 8);
      noteC.setAttribute('class', 'connNote' + (hasNotes ? ' has-notes' : ''));
      noteC.addEventListener('click', () => selectConnection(c.id));
      const noteTitle = document.createElementNS('http://www.w3.org/2000/svg','title');
      noteTitle.textContent = hasNotes ? 'Edit note / line style' : 'Add note / change line style';
      noteC.appendChild(noteTitle);
      g.appendChild(noteC);

      const noteT = document.createElementNS('http://www.w3.org/2000/svg','text');
      noteT.setAttribute('x', noteX); noteT.setAttribute('y', my + 3.2);
      noteT.setAttribute('class', 'connNoteTxt' + (hasNotes ? ' has-notes' : ''));
      noteT.style.fill = hasNotes ? '#eafff9' : '#8b93a1';
      noteT.textContent = '\uD83D\uDCDD';
      noteT.style.pointerEvents = 'none';
      g.appendChild(noteT);

      svg.appendChild(g);
    });
  }

  // ---------- Dragging ----------
  function makeDraggable(el, n){
    let startX, startY, origX, origY, dragging = false, groupOrigins = null;
    el.addEventListener('pointerdown', e => {
      if(connectMode) return;
      if(e.target.classList.contains('node-text')) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origX = n.x; origY = n.y;
      if(multiSelected.has(n.id) && multiSelected.size > 1){
        groupOrigins = new Map();
        multiSelected.forEach(id => {
          const gn = nodes.find(x => x.id === id);
          if(gn) groupOrigins.set(id, { x: gn.x, y: gn.y });
        });
      } else {
        groupOrigins = null;
        if(multiSelected.size) clearMultiSelection();
      }
    });
    el.addEventListener('pointermove', e => {
      if(!dragging) return;
      const deltaX = (e.clientX - startX) / scale;
      const deltaY = (e.clientY - startY) / scale;
      if(groupOrigins){
        groupOrigins.forEach((pos, id) => {
          const gn = nodes.find(x => x.id === id);
          if(!gn) return;
          gn.x = pos.x + deltaX;
          gn.y = pos.y + deltaY;
          const gEl = canvas.querySelector('.node[data-id="'+id+'"]');
          if(gEl){ gEl.style.left = gn.x + 'px'; gEl.style.top = gn.y + 'px'; }
        });
      } else {
        n.x = origX + deltaX;
        n.y = origY + deltaY;
        el.style.left = n.x + 'px';
        el.style.top = n.y + 'px';
      }
      drawConnections();
    });
    function stop(e){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
      if(dist < 5){
        if(groupOrigins) clearMultiSelection();
        selectNode(n.id);
      } else {
        notifyChange();
      }
      groupOrigins = null;
    }
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
  }

  // ---------- Node ops ----------
  function addNode(){
    const isFirst = nodes.length === 0;
    const c = centerOfWrapper();
    const world = screenToWorld(c.x, c.y);
    const n = {
      id: nextId(),
      x: world.x - 70 + (Math.random()*60-30),
      y: world.y - 20 + (Math.random()*60-30),
      text: 'New Idea',
      notes: '',
      color: isFirst ? '#f2b25c' : '',
      hasCheckbox: false,
      checked: false,
      shape: ''
    };
    nodes.push(n);
    render();
    requestAnimationFrame(() => {
      const el = canvas.querySelector('.node[data-id="'+n.id+'"] .node-text');
      if(el){
        el.focus();
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);
      }
    });
    notifyChange();
  }

  function addConnectedNode(parent, dir){
    const el = canvas.querySelector('.node[data-id="'+parent.id+'"]');
    const w = el ? el.offsetWidth : 160;
    const h = el ? el.offsetHeight : 50;
    const gapX = w + 90, gapY = h + 70;
    let x = parent.x, y = parent.y;
    if(dir === 'right'){ x = parent.x + gapX; }
    else if(dir === 'left'){ x = parent.x - gapX; }
    else if(dir === 'bottom'){ y = parent.y + gapY; }
    else if(dir === 'top'){ y = parent.y - gapY; }

    const n = { id: nextId(), x, y, text: 'New Idea', notes: '', color: '', hasCheckbox: false, checked: false, shape: '' };
    nodes.push(n);
    connections.push({ id:'c'+(idCounter++), from: parent.id, to: n.id, text:'', notes:'', lineStyle:'solid', lineColor:'' });
    render();

    requestAnimationFrame(() => {
      const txtEl = canvas.querySelector('.node[data-id="'+n.id+'"] .node-text');
      if(txtEl){
        txtEl.focus();
        const range = document.createRange();
        range.selectNodeContents(txtEl);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);
      }
    });
    notifyChange();
  }

  function deleteNode(id){
    nodes = nodes.filter(n => n.id !== id);
    connections = connections.filter(c => c.from !== id && c.to !== id);
    if(connectFrom === id) connectFrom = null;
    multiSelected.delete(id);
    render();
    notifyChange();
  }

  // ---------- Connection ops ----------
  function handleConnectClick(id, el){
    if(!connectFrom){
      connectFrom = id;
      el.classList.add('connectSelected');
      hint.textContent = 'Now click the node to connect to…';
    } else if(connectFrom === id){
      el.classList.remove('connectSelected');
      connectFrom = null;
      hint.textContent = 'Click a node to start a connection…';
    } else {
      const exists = connections.some(c =>
        (c.from===connectFrom && c.to===id) || (c.from===id && c.to===connectFrom));
      if(!exists){
        connections.push({ id:'c'+(idCounter++), from:connectFrom, to:id, text:'', notes:'', lineStyle:'solid', lineColor:'' });
      }
      canvas.querySelectorAll('.connectSelected').forEach(x=>x.classList.remove('connectSelected'));
      connectFrom = null;
      hint.textContent = 'Click a node to start a connection…';
      render();
      notifyChange();
    }
  }

  function deleteConnection(id){
    connections = connections.filter(c => c.id !== id);
    drawConnections();
    notifyChange();
  }

  function openConnEditor(c){
    document.getElementById('connEditor')?.remove();
    const a = nodeCenter(c.from), b = nodeCenter(c.to);
    if(!a || !b) return;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;

    const input = document.createElement('input');
    input.id = 'connEditor';
    input.value = c.text || '';
    input.placeholder = 'label';
    input.style.left = (mx - 60) + 'px';
    input.style.top = (my - 12) + 'px';
    input.style.width = '120px';
    canvas.appendChild(input);
    input.focus();
    input.select();

    function commit(){
      c.text = input.value.trim();
      input.remove();
      drawConnections();
      notifyChange();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
      if(e.key === 'Escape'){ input.removeEventListener('blur', commit); input.remove(); }
    });
  }

  // ---------- Toolbar actions ----------
  document.getElementById('addNodeBtn').addEventListener('click', addNode);

  document.getElementById('addContainerBtn').addEventListener('click', () => {
    const c = centerOfWrapper();
    const world = screenToWorld(c.x, c.y);
    const cont = {
      id: nextContainerId(),
      x: world.x - 220,
      y: world.y - 150,
      w: 440,
      h: 300,
      text: 'Container',
      color: '',
      borderColor: '',
      notes: ''
    };
    containers.push(cont);
    render();
    notifyChange();
  });

  const connectBtn = document.getElementById('connectBtn');
  connectBtn.addEventListener('click', () => {
    connectMode = !connectMode;
    connectBtn.classList.toggle('active', connectMode);
    canvas.classList.toggle('connectMode', connectMode);
    canvas.querySelectorAll('.node').forEach(n => n.classList.toggle('connectMode', connectMode));
    if(!connectMode){
      canvas.querySelectorAll('.connectSelected').forEach(x=>x.classList.remove('connectSelected'));
      connectFrom = null;
      hint.textContent = '';
    } else {
      hint.textContent = 'Click a node to start a connection…';
      closePanel();
      clearMultiSelection();
    }
  });

  const dragModeBtn = document.getElementById('dragModeBtn');
  dragModeBtn.addEventListener('click', () => {
    dragMode = dragMode === 'move' ? 'select' : 'move';
    if(dragMode === 'select'){
      dragModeBtn.textContent = '⬚ Select';
      dragModeBtn.classList.add('active');
      wrapper.classList.add('select-mode');
    } else {
      dragModeBtn.textContent = '🖐 Move';
      dragModeBtn.classList.remove('active');
      wrapper.classList.remove('select-mode');
      clearMultiSelection();
    }
  });

  const fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      applyLoadedData(reader.result);
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  function clearMap(){
    nodes = []; connections = []; containers = []; connectFrom = null;
    multiSelected.clear();
    render();
    notifyChange();
  }

  function newMap(){
    nodes = []; connections = []; containers = []; connectFrom = null;
    multiSelected.clear();
    idCounter = 1;
    fileHandle = null;
    fileName = null;
    clearTimeout(autoSaveTimer);
    scale = 1;
    const c = centerOfWrapper();
    panX = c.x; panY = c.y;
    applyTransform();
    render();
    updateFileNameLabel();
    refreshUnlinkedStatus();
  }

  const fileMenu = document.getElementById('fileMenu');
  document.getElementById('saveBtn').addEventListener('click', saveFile);

  fileMenu.addEventListener('change', () => {
    const action = fileMenu.value;
    fileMenu.value = '';
    if(action === 'new') newMap();
    else if(action === 'saveas') saveFileAs();
    else if(action === 'load') loadFile();
    else if(action === 'clear') clearMap();
  });

  // initial centered view, no default node
  const startCenter = centerOfWrapper();
  panX = startCenter.x; panY = startCenter.y;
  applyTransform();
  render();

  // custom fonts (Caveat, etc.) can finish loading after nodes are first
  // measured, subtly changing their width — redraw connections once fonts
  // are actually ready so lines don't end up pointing at stale positions.
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => drawConnections());
    document.fonts.addEventListener('loadingdone', () => drawConnections());
  }
})();
</script>
</body>
</html>
